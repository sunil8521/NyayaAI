[project]
name = "embeding-gpu-model"
version = "0.1.0"
description = "GPU-Accelerated BGE-M3 Embedding and Reranker Service for Rocky Legal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "flagembedding>=1.3.0",
    "torch>=2.4.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
