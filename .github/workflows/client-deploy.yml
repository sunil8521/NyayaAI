name: Deploy Client
on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - '.github/workflows/client-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          cd client
          docker build \
            --build-arg NEXT_PUBLIC_APP_URL="https://rocky.legal" \
            --build-arg BACKEND_INTERNAL_URL="http://host.docker.internal:4000" \
            -t saga8521/nyayaai-client:latest .

      - name: Save Docker Image to Tar
        run: docker save saga8521/nyayaai-client:latest -o client.tar

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Cleanup Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker rm -f nyayaai-client || true
            docker rmi saga8521/nyayaai-client:latest || true
            rm -f ~/client.tar ~/client.tar.gz ~/*.tar.gz
            docker image prune -f

      - name: Copy Tar to EC2
        run: |
          scp -i ~/.ssh/id_ed25519 client.tar ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/home/ubuntu/client.tar

      - name: Load and Run on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker load -i ~/client.tar
            rm -f ~/client.tar
            docker run -d \
              --name nyayaai-client \
              --restart always \
              -p 3000:3000 \
              -e PORT=3000 \
              --add-host=host.docker.internal:host-gateway \
              saga8521/nyayaai-client:latest
            docker image prune -f
