name: Deploy Client

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - '.github/workflows/client-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Build image
      - name: Build Docker Image
        run: |
          cd client
          docker build \
            --build-arg NEXT_PUBLIC_APP_URL="https://rocky.legal" \
            --build-arg BACKEND_INTERNAL_URL="http://nyayaai-backend:4000" \
            --build-arg NEXT_PUBLIC_ADMIN_EMAILS="sunilmaharana.0x@gmail.com,info@rocky.legal" \
            -t saga8521/nyayaai-client:latest .

      # 2. Save image
      - name: Save Docker Image
        run: |
          docker save saga8521/nyayaai-client:latest | gzip > client.tar.gz
          ls -lh client.tar.gz

      # 3. Cleanup Server
      - name: Cleanup Server
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -T \
            -o StrictHostKeyChecking=accept-new \
            -o KexAlgorithms=curve25519-sha256 \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e

            echo "=== Removing old container ==="
            docker rm -f nyayaai-client || true

            echo "=== Removing old image ==="
            docker rmi saga8521/nyayaai-client:latest || true

            echo "=== Cleaning old tar files ==="
            rm -f ~/client.tar
            rm -f ~/client.tar.gz
            rm -f ~/*.tar.gz

            echo "=== Docker cleanup ==="
            docker image prune -f
          EOF

      # 4. Copy new image
      - name: Copy Image to Server
        run: |
          # Force curve25519-sha256 to prevent MTU drop/connection closed on Ubuntu OpenSSH
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp \
            -o StrictHostKeyChecking=accept-new \
            -o KexAlgorithms=curve25519-sha256 \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -C \
            client.tar.gz \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:~/client.tar.gz

      # 5. Load + Run + Verify
      - name: Deploy Container
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -T \
            -o StrictHostKeyChecking=accept-new \
            -o KexAlgorithms=curve25519-sha256 \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e

            echo "=== Loading Docker image ==="
            docker load -i ~/client.tar.gz

            echo "=== Removing tar ==="
            rm -f ~/client.tar.gz

            echo "=== Checking Docker network ==="
            docker network inspect rockey-legal-network >/dev/null 2>&1 || {
              echo "ERROR: Docker network rockey-legal-network does not exist"
              docker network ls
              exit 1
            }

            echo "=== Starting container ==="
            docker run -d \
              --name nyayaai-client \
              --restart always \
              --network rockey-legal-network \
              -p 3000:3000 \
              saga8521/nyayaai-client:latest

            echo "=== Checking container ==="
            sleep 5

            docker ps -a --filter "name=nyayaai-client"

            echo "=== Container logs ==="
            docker logs --tail 100 nyayaai-client

            echo "=== Checking container is running ==="
            if [ "$(docker inspect -f '{{.State.Running}}' nyayaai-client)" != "true" ]; then
              echo "ERROR: Container exited!"
              docker inspect nyayaai-client
              exit 1
            fi

            echo "=== Deployment successful ==="
          EOF