name: Deploy Backend
on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          cd backend
          docker build -t saga8521/nyayaai-backend:latest .

      - name: Save Docker Image to Tar
        run: docker save saga8521/nyayaai-backend:latest -o backend.tar

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Free disk space on EC2 before upload
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            rm -f ~/backend.tar
            docker system prune -af || true

      - name: Copy Tar to EC2
        run: |
          scp -i ~/.ssh/id_ed25519 backend.tar ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/home/ubuntu/backend.tar

      - name: Load and Run on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker rm -f nyayaai-backend || true
            docker rmi saga8521/nyayaai-backend:latest || true
            docker load -i ~/backend.tar
            rm ~/backend.tar
            docker run -d \
              --name nyayaai-backend \
              --restart always \
              -p 4000:4000 \
              -e PORT=4000 \
              -e BETTER_AUTH_URL="${{ secrets.BETTER_AUTH_URL }}" \
              -e BETTER_AUTH_SECRET="${{ secrets.BETTER_AUTH_SECRET }}" \
              -e MONGODB_URI="${{ secrets.MONGODB_URI }}" \
              -e CLIENT_ORIGIN="${{ secrets.CLIENT_ORIGIN }}" \
              -e GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
              -e GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              -e GEMINI_KEY="${{ secrets.GEMINI_KEY }}" \
              -e MODEL_NAME="gemini-2.5-flash" \
              saga8521/nyayaai-backend:latest
            docker image prune -f
