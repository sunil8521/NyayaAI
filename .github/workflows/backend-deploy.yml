name: Deploy Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Build Docker image
      - name: Build Docker Image
        run: |
          cd backend
          docker build -t saga8521/nyayaai-backend:latest .

      # 2. Save Docker image
      - name: Save Docker Image
        run: |
          docker save saga8521/nyayaai-backend:latest | gzip > backend.tar.gz
          ls -lh backend.tar.gz

      # 3. Cleanup Server
      - name: Cleanup Server
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -T \
            -o StrictHostKeyChecking=accept-new \
            -o KexAlgorithms=curve25519-sha256 \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e

            echo "=== Removing old backend container ==="
            docker rm -f nyayaai-backend || true

            echo "=== Removing old backend image ==="
            docker rmi saga8521/nyayaai-backend:latest || true

            echo "=== Removing old tar files ==="
            rm -f ~/backend.tar
            rm -f ~/backend.tar.gz

            echo "=== Cleaning unused images ==="
            docker image prune -f
          EOF

      # 4. Copy new image to Server
      - name: Copy Image to Server
        run: |
          # Force curve25519-sha256 to prevent MTU drop/connection closed on Ubuntu OpenSSH
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp \
            -o StrictHostKeyChecking=accept-new \
            -o KexAlgorithms=curve25519-sha256 \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -C \
            backend.tar.gz \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:~/backend.tar.gz

      # 5. Load and run backend
      - name: Deploy Backend Container
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -T \
            -o StrictHostKeyChecking=accept-new \
            -o KexAlgorithms=curve25519-sha256 \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e

            echo "=== Loading Docker image ==="
            docker load -i ~/backend.tar.gz

            echo "=== Removing tar file ==="
            rm -f ~/backend.tar.gz

            echo "=== Checking Docker network ==="
            docker network inspect rockey-legal-network >/dev/null 2>&1 || {
              echo "ERROR: Docker network rockey-legal-network does not exist"
              docker network ls
              exit 1
            }

            echo "=== Checking environment file ==="
            if [ ! -f ~/.env.backend ]; then
              echo "ERROR: ~/.env.backend does not exist"
              exit 1
            fi

            echo "=== Starting backend container ==="
            docker run -d \
              --name nyayaai-backend \
              --restart always \
              --network rockey-legal-network \
              -p 4000:4000 \
              --env-file ~/.env.backend \
              saga8521/nyayaai-backend:latest

            echo "=== Waiting for container ==="
            sleep 5

            echo "=== Container status ==="
            docker ps -a --filter "name=nyayaai-backend"

            echo "=== Backend logs ==="
            docker logs --tail 100 nyayaai-backend

            echo "=== Verifying container is running ==="
            if [ "$(docker inspect -f '{{.State.Running}}' nyayaai-backend)" != "true" ]; then
              echo "ERROR: Backend container is not running!"
              echo "Exit code:"
              docker inspect -f '{{.State.ExitCode}}' nyayaai-backend
              exit 1
            fi

            echo "=== Backend deployment successful ==="

            echo "=== Cleaning unused images ==="
            docker image prune -f
          EOF