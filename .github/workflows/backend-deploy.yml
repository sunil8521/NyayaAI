
name: Deploy Backend

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

jobs:

  # STEP 1: Build and push Docker image
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            saga8521/server:latest
            saga8521/server:${{ github.sha }}

  # STEP 2: Deploy on EC2
  deploy:
    needs: build
    runs-on: ubuntu-latest

    
    steps:
      - name: Deploy Backend on Server
        uses: appleboy/ssh-action@v1.2.2

        env:
          IMAGE_TAG: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}

          envs: IMAGE_TAG,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN

          script: |
            set -e

            IMAGE="saga8521/server"
            CONTAINER="nyayaai-backend"

            echo "===== Docker Hub Login ====="

            echo "$DOCKERHUB_TOKEN" | docker login \
              -u "$DOCKERHUB_USERNAME" \
              --password-stdin

            echo "===== Pulling New Backend Image ====="

            docker pull "$IMAGE:$IMAGE_TAG"

            docker logout

            echo "===== Checking Docker Network ====="

            docker network inspect rockey-legal-network >/dev/null 2>&1 || {
              echo "ERROR: Docker network does not exist"
              docker network ls
              exit 1
            }

            echo "===== Checking Environment File ====="

            if [ ! -f "$HOME/.env.backend" ]; then
              echo "ERROR: ~/.env.backend does not exist"
              exit 1
            fi

            echo "===== Removing Old Backend Container ====="

            docker rm -f "$CONTAINER" || true

            echo "===== Starting New Backend Container ====="

            docker run -d \
              --name "$CONTAINER" \
              --restart always \
              --network rockey-legal-network \
              -p 4000:4000 \
              --env-file "$HOME/.env.backend" \
              "$IMAGE:$IMAGE_TAG"

            echo "===== Waiting for Backend ====="

            sleep 5

            echo "===== Container Status ====="

            docker ps -a --filter "name=$CONTAINER"

            echo "===== Backend Logs ====="

            docker logs --tail 100 "$CONTAINER"

            echo "===== Verifying Container ====="

            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER")" != "true" ]; then

              echo "ERROR: Backend container failed!"

              docker inspect "$CONTAINER"
              docker logs --tail 100 "$CONTAINER"

              exit 1
            fi

            echo "===== Cleaning Dangling Images ====="

            docker image prune -f

            echo "===== Backend Deployment Successful ====="
