name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Build Docker image
      - name: Build Docker Image
        run: |
          cd backend
          docker build -t saga8521/nyayaai-backend:latest .

      # 2. Save Docker image
      - name: Save Docker Image
        run: |
          docker save saga8521/nyayaai-backend:latest | gzip > backend.tar.gz
          ls -lh backend.tar.gz

      # 3. Setup SSH
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # 4. Remove old container and image
      - name: Cleanup Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            echo "=== Removing old backend container ==="
            docker rm -f nyayaai-backend || true

            echo "=== Removing old backend image ==="
            docker rmi saga8521/nyayaai-backend:latest || true

            echo "=== Removing old tar files ==="
            rm -f /home/ubuntu/backend.tar
            rm -f /home/ubuntu/backend.tar.gz

            echo "=== Cleaning unused images ==="
            docker image prune -f

      # 5. Copy new image to EC2
      - name: Copy Image to EC2
        run: |
          scp \
            -i ~/.ssh/id_ed25519 \
            backend.tar.gz \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/home/ubuntu/backend.tar.gz

      # 6. Load and run backend
      - name: Deploy Backend Container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            echo "=== Loading Docker image ==="
            docker load -i /home/ubuntu/backend.tar.gz

            echo "=== Removing tar file ==="
            rm -f /home/ubuntu/backend.tar.gz

            echo "=== Checking Docker network ==="
            docker network inspect rockey-legal-network >/dev/null 2>&1 || {
              echo "ERROR: Docker network rockey-legal-network does not exist"
              docker network ls
              exit 1
            }

            echo "=== Checking environment file ==="
            if [ ! -f /home/ubuntu/.env.backend ]; then
              echo "ERROR: /home/ubuntu/.env.backend does not exist"
              exit 1
            fi

            echo "=== Starting backend container ==="
            docker run -d \
              --name nyayaai-backend \
              --restart always \
              --network rockey-legal-network \
              -p 4000:4000 \
              --env-file /home/ubuntu/.env.backend \
              saga8521/nyayaai-backend:latest

            echo "=== Waiting for container ==="
            sleep 5

            echo "=== Container status ==="
            docker ps -a --filter "name=nyayaai-backend"

            echo "=== Backend logs ==="
            docker logs --tail 100 nyayaai-backend

            echo "=== Verifying container is running ==="
            if [ "$(docker inspect -f '{{.State.Running}}' nyayaai-backend)" != "true" ]; then
              echo "ERROR: Backend container is not running!"
              echo "Exit code:"
              docker inspect -f '{{.State.ExitCode}}' nyayaai-backend
              exit 1
            fi

            echo "=== Backend deployment successful ==="

            echo "=== Cleaning unused images ==="
            docker image prune -f