
name: Deploy Embedding Server

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'embeding-model/**'
      - '.github/workflows/embedding-deploy.yml'

jobs:

  # STEP 1: Build and push Docker image
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Embedding Image
        uses: docker/build-push-action@v6
        with:
          context: ./embeding-model
          push: true
          tags: |
            saga8521/python-server:latest
            saga8521/python-server:${{ github.sha }}

  # STEP 2: Deploy on EC2
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Embedding Server
        uses: appleboy/ssh-action@v1.2.2

        env:
          IMAGE_TAG: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}

          envs: IMAGE_TAG,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN

          script: |
            set -e

            IMAGE="saga8521/python-server"
            CONTAINER="embedding-server"

            echo "===== Docker Hub Login ====="

            echo "$DOCKERHUB_TOKEN" | docker login \
              -u "$DOCKERHUB_USERNAME" \
              --password-stdin

            echo "===== Pulling New Image ====="

            docker pull "$IMAGE:$IMAGE_TAG"

            docker logout

            echo "===== Checking Docker Network ====="

            docker network inspect rockey-legal-network >/dev/null 2>&1 || {
              echo "ERROR: Docker network does not exist"
              docker network ls
              exit 1
            }

            echo "===== Preparing Persistent Model Cache ====="

            mkdir -p "$HOME/cached_models"

            echo "Model cache directory:"
            du -sh "$HOME/cached_models" || true

            echo "===== Removing Old Container ====="

            docker rm -f "$CONTAINER" || true

            echo "===== Starting Embedding Server ====="

            docker run -d \
              --name "$CONTAINER" \
              --restart always \
              --network rockey-legal-network \
              -p 8000:8000 \
              -v "$HOME/cached_models:/app/model_cache" \
              "$IMAGE:$IMAGE_TAG"

            echo "===== Waiting for Container ====="

            sleep 5

            echo "===== Container Status ====="

            docker ps -a --filter "name=$CONTAINER"

            echo "===== Container Logs ====="

            docker logs --tail 100 "$CONTAINER"

            echo "===== Verifying Container ====="

            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER")" != "true" ]; then

              echo "ERROR: Embedding server failed!"

              docker logs --tail 100 "$CONTAINER"

              exit 1
            fi

            echo "===== Cleaning Dangling Images ====="

            docker image prune -f

            echo "===== Embedding Server Deployment Successful ====="
