name: Deploy Embedding Server

on:
  push:
    branches:
      - main
    paths:
      - 'embeding-model/**'
      - '.github/workflows/embedding-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Build Docker image
      - name: Build Docker Image
        run: |
          cd embeding-model
          docker build -t saga8521/embedding-server:latest .

      # 2. Save Docker image
      - name: Save Docker Image
        run: |
          docker save saga8521/embedding-server:latest | gzip > embedding.tar.gz
          ls -lh embedding.tar.gz

      # 3. Setup SSH
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # 4. Remove old container and image
      - name: Cleanup Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            echo "=== Removing old embedding container ==="
            docker rm -f embedding-server || true

            echo "=== Removing old embedding image ==="
            docker rmi saga8521/embedding-server:latest || true

            echo "=== Removing old tar files ==="
            rm -f /home/ubuntu/embedding.tar
            rm -f /home/ubuntu/embedding.tar.gz

            echo "=== Cleaning unused images ==="
            docker image prune -f

      # 5. Copy new image to EC2
      - name: Copy Image to EC2
        run: |
          scp \
            -i ~/.ssh/id_ed25519 \
            embedding.tar.gz \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/home/ubuntu/embedding.tar.gz

      # 6. Load and run embedding server
      - name: Deploy Embedding Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            echo "=== Loading Docker image ==="
            docker load -i /home/ubuntu/embedding.tar.gz

            echo "=== Removing tar file ==="
            rm -f /home/ubuntu/embedding.tar.gz

            echo "=== Checking Docker network ==="
            docker network inspect rockey-legal-network >/dev/null 2>&1 || {
              echo "ERROR: Docker network rockey-legal-network does not exist"
              docker network ls
              exit 1
            }

            echo "=== Checking model cache directory ==="
            mkdir -p ~/cached_models

            echo "=== Starting embedding server ==="
            docker run -d \
              --name embedding-server \
              --restart always \
              --network rockey-legal-network \
              -p 8000:8000 \
              -v /home/ubuntu/cached_models:/app/model_cache \
              saga8521/embedding-server:latest

            echo "=== Waiting for container ==="
            sleep 5

            echo "=== Container status ==="
            docker ps -a --filter "name=embedding-server"

            echo "=== Container logs ==="
            docker logs --tail 100 embedding-server

            echo "=== Verifying container is running ==="
            if [ "$(docker inspect -f '{{.State.Running}}' embedding-server)" != "true" ]; then
              echo "ERROR: Embedding server container is not running!"
              echo "Exit code:"
              docker inspect -f '{{.State.ExitCode}}' embedding-server
              exit 1
            fi

            echo "=== Embedding server deployment successful ==="

            echo "=== Cleaning unused images ==="
            docker image prune -f