name: Deploy Embedding Server
on:
  push:
    branches:
      - main
    paths:
      - 'embeding-model/**'
      - '.github/workflows/embedding-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          cd embeding-model
          docker build -t saga8521/embedding-server:latest .

      - name: Save Docker Image to Tar
        run: docker save saga8521/embedding-server:latest | gzip > embedding.tar.gz

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Cleanup Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            docker rm -f embedding-server || true
            docker rmi saga8521/embedding-server:latest || true
            rm -f ~/embedding.tar ~/embedding.tar.gz
            docker image prune -f

      - name: Copy Tar to EC2
        run: |
          scp -i ~/.ssh/id_ed25519 embedding.tar.gz ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/home/ubuntu/embedding.tar.gz

      - name: Load and Run on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            docker load -i ~/embedding.tar.gz
            rm -f ~/embedding.tar.gz
            docker run -d \
              --name embedding-server \
              --restart always \
              --network rockey-legal-network \
              -p 8000:8000 \
              -v /home/ubuntu/cached_models:/app/model_cache \
              saga8521/embedding-server:latest
            docker image prune -f
