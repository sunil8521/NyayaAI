[project]
name = "embeding-model"
version = "0.1.0"
description = "BGE-M3 Embedding and Reranker Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "flagembedding>=1.3.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
